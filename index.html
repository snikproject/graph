<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Ontology Graph</title>
		<link rel="icon" type="image/png" href="/img/favicon-32x32.png" sizes="32x32" />
		<link rel="icon" type="image/png" href="/img/favicon-16x16.png" sizes="16x16" />
		<link rel="stylesheet" type="text/css" href="./css/style.css" media="screen" />
		<link rel="stylesheet" type="text/css" href="./css/overlay.css" media="screen" />
		<script type="module" src="./js/browser/main.ts"></script>
	</head>

	<body style="margin: 0; height: 100vh; overflow: hidden">
		<noscript>
			<h1>
				JavaScript is off.
				<a href="http://enable-javascript.com/">Please enable</a>
				to view site.
			</h1>
		</noscript>

		<div id="top">
			<form id="search" method="post">
				<label class="visually-hidden" for="search-field" data-i18n="search-field"></label>
				<input type="text" name="query" id="search-field" list="matches" placeholder="🔍 Class Name" />
			</form>
		</div>

		<div id="overlay-legend" class="overlay-legend"></div>

		<div id="search-results" class="fullscreen modal" aria-hidden="true">
			<header>
				<h2 id="h2:search-results">Search Results</h2>
				<a href="javascript:void(0)" class="closebtn" data-micromodal-close>
					<span aria-hidden="true">&times;</span>
					<span class="visually-hidden" data-i18n="close"></span>
				</a>
			</header>
			<table id="tab:search-results"></table>
		</div>

		<div id="chapter-search" class="fullscreen modal" aria-hidden="true">
			<header>
				<h2><span data-i18n="chapter-search">Chapter Search</span></h2>
				<a href="javascript:void(0)" class="closebtn" data-micromodal-close>
					<span aria-hidden="true">&times;</span>
					<span class="visually-hidden" data-i18n="close"></span>
				</a>
			</header>
			<table id="tab:chapter-search-chapters" style="float: left; margin-right: 5em"></table>
			<table id="tab:chapter-search-classes" style="float: left"></table>
		</div>

		<div id="subontology-connectivity" class="fullscreen modal" aria-hidden="true">
			<header>
				<h2><span data-i18n="choose-subontologies">Choose two Subontologies to Connect</span></h2>
				<a href="javascript:void(0)" class="closebtn" data-micromodal-close>
					<span aria-hidden="true">&times;</span>
					<span class="visually-hidden" data-i18n="close"></span>
				</a>
			</header>
			<form id="subontology-connectivity-form">
				<label class="visually-hidden" for="subontology-connectivity-select1" data-i18n="first-subontology"></label>
				<select id="subontology-connectivity-select1" name="subontology-connectivity-select1">
					<option value="ob">Orange Book</option>
					<option value="bb">Blue Book</option>
					<option value="he">Heinrich et al.</option>
					<option value="ciox">CIO X</option>
				</select>
				<label class="visually-hidden" for="subontology-connectivity-select2" data-i18n="second-subontology"></label>
				<select id="subontology-connectivity-select2" name="subontology-connectivity-select2">
					<option value="bb">Blue Book</option>
					<option value="ob">Orange Book</option>
					<option value="he">Heinrich et al.</option>
					<option value="ciox">CIO X</option>
				</select>
				<input type="submit" data-i18n="show-connectivity" value="Show Connectivity" />
			</form>
		</div>

		<div id="loadarea"></div>

		<template id="goldenlayout-header" type="text/html">
			<li class="recalculatesign" id="recalculatesign" title="Recalculate layout" role="button" tabindex="0"></li>
			<li class="tightlayoutsign" id="tightlayoutsign" title="Tight layout" role="button" tabindex="0"></li>
			<li class="compoundlayoutsign" id="compoundlayoutsign" title="Compound layout" role="button" tabindex="0"></li>
			<li class="addsign" id="addsign" title="New view" role="button" tabindex="0"></li>
			<li class="plussign" id="plussign" title="Zoom in" role="button" tabindex="0"></li>
			<li class="minussign" id="minussign" title="Zoom out" role="button" tabindex="0"></li>
		</template>
	</body>
</html>
